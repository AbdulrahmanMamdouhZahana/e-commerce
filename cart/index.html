<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="..//home/Project_Pic/icon.png" type="image/x-icon">
  <title>Product Cart</title>
 <link rel="stylesheet" href="css/style.css">
</head>
<body>




  <div class="container">
    <!-- Form Section -->
    <div class="form-box">
      <h3>Your Information</h3>
      <div class="input-group">
        <label>Phone</label>
        <input type="text" placeholder="+2010XXXXXXX">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email address">
      </div>
      <h3>Shipping Address</h3>
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" placeholder="First and last name">
      </div>
      <div class="input-group">
        <label>Address</label>
        <input type="text" placeholder="Street name or compound">
      </div>
     
      
      <div class="input-group">
        <label>Area</label>
        <input type="text" placeholder="Enter area name">
      </div>
      <div class="payment-options">
        <h3>Payment Method</h3>
        <label><input type="radio" name="pay" checked> Cash on Delivery</label>
      </div>
      <button class="button">Confirm Order - EGP 0</button>
      <div class="footer">Your data is stored securely </div>
    </div>
  
    <!-- Summary Section -->
    <div class="summary-box">


      <div class="product_in"></div>
      
      <div class="if_no_product">
      <div class="cart-icon">🛒</div>
      <p>Your shopping cart is empty</p>
    </div>
    <button class="btn-add" >Add Products +</button>






      <div class="totals">

      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
